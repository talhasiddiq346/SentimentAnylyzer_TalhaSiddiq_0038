<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentiment Analyzer · Talha Siddiq</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0f19; --panel:#111827; --line:#1f2937; --txt:#e5e7eb; --mut:#9ca3af; --acc:#818cf8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:Inter,system-ui,sans-serif; }
  .wrap { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px;
           padding:14px 22px; border-bottom:1px solid var(--line); background:var(--panel); }
  .brand { font-weight:800; letter-spacing:-.02em; }
  .brand span { color:var(--acc); }
  .meta { font-size:.82rem; color:var(--mut); text-align:right; }
  .frame { position:relative; flex:1; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
  .loader { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:12px; color:var(--mut); font-size:.9rem; pointer-events:none; }
  .dot { width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--acc);
         animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  footer { padding:10px 22px; font-size:.78rem; color:var(--mut); border-top:1px solid var(--line);
           background:var(--panel); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  footer a { color:var(--acc); text-decoration:none; }
  @media (max-width:600px){ .meta{display:none;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">🧠 Sentiment <span>Analyzer</span></div>
    <div class="meta">Talha Siddiq · B04-0923-000038<br>CS4106 · Foundations of Generative AI</div>
  </header>
  <div class="frame">
    <div class="loader"><div class="dot"></div>Loading app… if it's asleep, click “wake up” and wait ~1 min.</div>
    <iframe src="https://STREAMLIT_LINK.streamlit.app/?embed=true" title="Sentiment Analyzer" allow="clipboard-write"></iframe>
  </div>
</div>
</body>
</html>
